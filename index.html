<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NeuroMap 3D Brain — realistic interactive anatomy</title>
    <meta
      name="description"
      content="A realistic, browser-based interactive 3D brain rendered from real sourced anatomy. Orbit, fade the cortex, and inspect 437 named structures."
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="scene" aria-label="Interactive 3D brain viewport"></div>
    <div id="vignette" aria-hidden="true"></div>
    <div id="sr-status" class="sr-only" role="status" aria-live="polite"></div>

    <div id="loader" role="status">
      <div class="loader-box">
        <div class="loader-title">Loading brain anatomy…</div>
        <div class="loader-bar"><div id="loadfill"></div></div>
        <div id="loadmsg" class="loader-msg">Fetching model</div>
      </div>
    </div>

    <header class="brand">
      <h1>NeuroMap <span>Brain + Clinic</span></h1>
      <p id="stats">Loading…</p>
    </header>

    <nav id="viewtabs" aria-label="Content views">
      <button type="button" data-view="brain" class="on">3D Brain</button>
      <button type="button" data-view="circuits">Circuits</button>
      <button type="button" data-view="transmitters">Transmitters</button>
      <button type="button" data-view="syndromes">Syndromes</button>
      <button type="button" data-view="drugs">Drugs</button>
    </nav>

    <aside id="clinic" aria-label="Clinical reference" hidden>
      <div id="clinicHome">
        <label class="row search-row">
          <span id="clinicSearchLabel">Search</span>
          <input id="clinicSearch" type="search" placeholder="" autocomplete="off" />
        </label>
        <div id="clinicList"></div>
      </div>
      <div id="clinicDetail" hidden>
        <button id="clinicBack" type="button">← All</button>
        <div id="clinicBody"></div>
      </div>
    </aside>

    <aside class="panel" aria-label="Viewer controls">
      <label class="row search-row">
        <span>Search structures</span>
        <input
          id="search"
          type="search"
          placeholder="e.g. thalamus, arcuate, cingulum…"
          autocomplete="off"
        />
      </label>
      <div id="results" class="results" hidden></div>
      <label class="row slider-row">
        <span>Cortex opacity <b id="opval">100%</b></span>
        <input id="cortexOpacity" type="range" min="0" max="100" value="100" />
      </label>
      <div class="row slice-row">
        <span>Hemisphere</span>
        <div class="seg" role="group" aria-label="Hemisphere">
          <button type="button" data-hemi="both" class="on">Both</button>
          <button type="button" data-hemi="left">Left</button>
          <button type="button" data-hemi="right">Right</button>
        </div>
      </div>
      <div class="row btn-row">
        <button id="lobeBtn" type="button" title="Color cortex by lobe">Lobe colors: off</button>
      </div>
      <div class="row slice-row">
        <span>Camera views</span>
        <div class="seg" role="group" aria-label="Preset camera views">
          <button type="button" data-view3d="front">Front</button>
          <button type="button" data-view3d="side">Side</button>
          <button type="button" data-view3d="top">Top</button>
          <button type="button" data-view3d="home">3/4</button>
        </div>
      </div>
      <div class="row slice-row">
        <span>Slice plane</span>
        <div class="seg" role="group" aria-label="Slice plane orientation">
          <button type="button" data-slice="off" class="on">Off</button>
          <button type="button" data-slice="x">Sagittal</button>
          <button type="button" data-slice="z">Coronal</button>
          <button type="button" data-slice="y">Axial</button>
        </div>
        <input id="slicePos" type="range" min="0" max="100" value="50" disabled />
      </div>
      <div class="row btn-row">
        <button id="isolateBtn" type="button" title="Fade cortex to reveal deep nuclei">
          Reveal deep brain
        </button>
        <button id="resetBtn" type="button" title="Restore default camera">Reset view</button>
      </div>
      <div class="row btn-row">
        <button id="shotBtn" type="button" title="Download a PNG of the current view">
          Download screenshot
        </button>
      </div>
      <label class="row check-row">
        <input id="spinToggle" type="checkbox" checked /> Idle auto-rotate
      </label>
      <label class="row check-row">
        <input id="labelToggle" type="checkbox" /> Labels
      </label>
      <details class="cats" open>
        <summary>Systems</summary>
        <div id="catlist"></div>
      </details>
    </aside>

    <section id="card" class="card" hidden aria-live="polite">
      <button id="cardClose" type="button" aria-label="Clear selection">×</button>
      <div id="cardSide" class="side"></div>
      <h2 id="cardName"></h2>
      <p id="cardMeta" class="meta"></p>
      <p class="ta2label">TA2 anatomical path</p>
      <p id="cardTa2" class="ta2"></p>
      <p class="ta2label" id="funcLabel" hidden>Function</p>
      <p id="cardFunc" class="func" hidden></p>
      <p class="ta2label" id="decLabel" hidden>Decussation</p>
      <p id="cardDec" class="func" hidden></p>
      <p id="cardSrc" class="src"></p>
      <div class="card-btns">
        <button id="focusBtn" type="button">Focus camera</button>
        <button id="isolateBtn2" type="button" title="Show only this structure">Isolate</button>
        <button id="shareBtn" type="button" title="Copy a link to this exact view">
          Share link
        </button>
      </div>
    </section>

    <footer class="credit">
      Anatomy © Z-Anatomy contributors · BodyParts3D / DBCLS (CC BY-SA 4.0) ·
      deep nuclei ≈7&nbsp;mm, educational only
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
