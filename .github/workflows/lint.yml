name: Content lint and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 1. Syntax gate on every source and script file.
      - name: Syntax check
        run: |
          node --check src/main.js
          node --check src/clinical.js
          node --check src/disorder.js
          node --check scripts/validate-disorders.mjs
          node --check scripts/test-mapping.mjs
          node --check scripts/copy-content.mjs
          node --check scripts/check-functions.mjs
          node --check scripts/coverage.mjs
          node --check scripts/coverage-map.mjs
          node --check src/explore.js

      # 2. JSON well-formedness for the whole content tree.
      - name: Validate content JSON
        run: |
          for f in content/*.json content/*/*.json public/brain-atlas/models/manifest.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || exit 1
          done

      # 3. Content lint in release mode: no unsourced claims, no dangling
      #    atlas labels, no unresolved references, quiz/tour minimums.
      - name: Content lint (strict)
        run: node scripts/validate-disorders.mjs --strict

      # 4. Unit tests for the data -> 3D highlight mapping.
      - name: Mapping tests
        run: node scripts/test-mapping.mjs

      # 4b. The colour-by-function classification must still resolve, and no
      #     rule may silently stop matching the atlas.
      - name: Function classification audit
        run: node scripts/check-functions.mjs

      # 4c. Universal explore coverage: space-map integrity, resolver unit
      #     tests, and the regenerated per-entity mapping audit.
      - name: Explore coverage audit
        run: node scripts/coverage-map.mjs

      # 5. Production build, including the content/ copy step.
      - name: Build
        run: npm ci && npm run build

      # 6. The build must actually contain the content the app fetches.
      - name: Verify content shipped
        run: |
          test -f dist/content/index.json
          test -f dist/content/markers.json
          for d in dist/content/disorders/*.json; do
            echo "  shipped: $d"
          done

      # 7. Licence and attribution documents must be reachable on the
      #    deployed site, and the in-app footer must still point at them.
      #    Apache-2.0 s4(a) requires recipients are given a copy of the
      #    licence; CC BY-SA 4.0 requires the model attribution travels
      #    with any redistribution.
      - name: Verify licences and attribution shipped
        run: |
          for f in LICENSE LICENSE-APACHE-2.0.txt DATA_LICENSES.md THIRD-PARTY-NOTICES.md; do
            test -f "dist/$f" || { echo "  MISSING from dist: $f"; exit 1; }
            echo "  shipped: dist/$f"
          done
          # The footer link target must exist, or the credits link 404s.
          grep -q 'THIRD-PARTY-NOTICES.md' dist/index.html \
            || { echo "  footer no longer links the credits page"; exit 1; }
          # Attribution and the educational-use notice must be present.
          grep -q 'Z-Anatomy' dist/index.html || { echo "  model attribution missing"; exit 1; }
          grep -qi 'not diagnostic advice' dist/index.html \
            || { echo "  educational-use disclaimer missing from the global UI"; exit 1; }
          # The full Apache-2.0 text must actually be the licence, not a stub.
          grep -q 'TERMS AND CONDITIONS FOR USE, REPRODUCTION, AND DISTRIBUTION' \
            dist/LICENSE-APACHE-2.0.txt || { echo "  Apache-2.0 text looks truncated"; exit 1; }
          echo "  licences and attribution verified"
